name: Simple CI

on:
 push:
   branches: [main]
 pull_request:
   branches: [main]

env:
  IMAGE_NAME: entries-api

jobs:
  ci:
    runs-on: ubuntu-latest


    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Simple Check
        run: python3 -m compileall -q .


      - name: Build  docker image
        run: |
         SHORT_SHA=${{github.sha}}
         echo "Building docker image with tag: ${{ env.IMAGE_NAME }}:${SHORT_SHA}" 
         docker build --tag ${{ env.IMAGE_NAME }}:${SHORT_SHA} .
         docker images