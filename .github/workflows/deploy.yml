name: Deploy to AWS ECS Fargate

on:
 push:
   branches: [main]
 pull_request:
   branches: [main]


permissions:
  id-token: write    # allow OIDC token
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{vars.ECS_CLUSTER}}     
  ECS_SERVICE: ${{vars.ECS_SERVICE}}
  ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}    

jobs:

  main:
    runs-on: ubuntu-latest


    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Simple Check
        run: python3 -m compileall -q .

      - name: Set short git commit SHA
        run: |
         calculatedSha=$(git rev-parse --short ${{ github.sha }})
         echo "COMMIT_SHORT_SHA=$calculatedSha" >> $GITHUB_ENV

      - name: Build  docker image
        id: build-image
        run: |
         IMAGE_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${COMMIT_SHORT_SHA}
         docker build --provenance=false --sbom=false  --build-arg APP_VERSION=${COMMIT_SHORT_SHA} --tag ${IMAGE_URI} .
         docker images
         echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{env.IMAGE_URI}}
          format: "table"
          exit-code: 1
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws ecr get-login-password --region ${AWS_REGION} \
            | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

      - name: Push docker image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
         echo "pushing docker image to ECR: ${IMAGE_URI}"
         docker push ${IMAGE_URI}